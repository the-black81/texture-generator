<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Mapas PBR Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent: #e67e22;
            --text-color: #f0f0f0;
            --border-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1100px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .sidebar {
            width: 340px;
            background: #181818;
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            gap: 20px;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
            background: #151515;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }

        .drop-zone:hover {
            border-color: var(--accent);
        }

        .hidden {
            display: none !important;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }

        .thumbnail-box img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            border-radius: 4px;
        }

        .remove-thumb {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-thumb:hover {
            background: #c0392b;
        }

        .section-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            min-width: 0;
        }

        .tabs-header {
            display: flex;
            background: #151515;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 15px 20px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .tab-btn:hover {
            background: rgba(230, 126, 34, 0.1);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            font-weight: bold;
        }

        .viewer-container {
            flex: 1;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121212;
            min-height: 400px;
            position: relative;
        }

        .canvas-wrapper {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .footer-action {
            padding: 20px;
            background: #181818;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 2;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-secondary {
            flex: 1;
            background: #333;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .btn-primary:not(:disabled):hover {
            opacity: 0.9;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
            font-size: 18px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 1000;
            transition: opacity 0.3s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div id="dropZone" class="drop-zone">
                <div id="dropContent">
                    <p style="margin: 0 0 5px 0; font-size: 13px; color: #ccc;">📂 Arrastra tu textura o <strong>haz clic</strong></p>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">

            <div id="thumbnailContainer" class="thumbnail-box hidden">
                <button id="removeImage" class="remove-thumb" title="Cambiar textura">✕</button>
                <img id="thumbPreview" src="" alt="Miniatura">
            </div>

            <div>
                <div class="section-title">Generar Mapas PBR</div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="genBaseColor" checked> Base Color (Albedo)</label>
                    <label><input type="checkbox" id="genRoughness" checked> Roughness (Rugosidad)</label>
                    <label><input type="checkbox" id="genNormal" checked> Normal Map (Relieve)</label>
                    <label><input type="checkbox" id="genHeight" checked> Height / Displacement</label>
                    <label><input type="checkbox" id="genAO" checked> Ambient Occlusion</label>
                </div>
            </div>

            <div>
                <div class="section-title">Entorno y Fondo</div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="genHDRI" checked> Generar HDRI / Panorama</label>
                </div>
            </div>

            <div style="margin-top: auto;">
                <div class="section-title">Nombre del Asset (Personalizable)</div>
                <input type="text" id="assetName" value="MaterialPro_01" style="width: 100%; padding: 8px; background: #121212; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; box-sizing: border-box;">
            </div>
        </div>

        <div class="content-area">
            <div class="tabs-header">
                <button class="tab-btn active" data-map="basecolor">Base Color</button>
                <button class="tab-btn" data-map="roughness">Roughness</button>
                <button class="tab-btn" data-map="normal">Normal</button>
                <button class="tab-btn" data-map="height">Height</button>
                <button class="tab-btn" data-map="ao">AO</button>
                <button class="tab-btn" data-map="hdri">HDRI Panorama</button>
            </div>

            <div class="viewer-container">
                <div class="canvas-wrapper">
                    <canvas id="renderCanvas"></canvas>
                </div>
            </div>

            <div class="footer-action">
                <button id="processBtn" class="btn-primary" disabled>Generar y Descargar Pack ZIP</button>
                <button id="copyBtn" class="btn-secondary">📋 Copiar Código</button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <p id="loadingText">Procesando...</p>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const thumbPreview = document.getElementById('thumbPreview');
        const removeImage = document.getElementById('removeImage');
        const processBtn = document.getElementById('processBtn');
        const copyBtn = document.getElementById('copyBtn');
        const assetNameInput = document.getElementById('assetName');
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        let loadedImage = null;
        let currentActiveTab = 'basecolor';
        let processedMaps = {};

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.style.borderColor = '#e67e22';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.style.borderColor = '#2c2c2c';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.style.borderColor = '#2c2c2c';
            if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        removeImage.addEventListener('click', (e) => {
            e.stopPropagation();
            loadedImage = null;
            fileInput.value = '';
            thumbnailContainer.classList.add('hidden');
            dropZone.classList.remove('hidden');
            processBtn.disabled = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            processedMaps = {};
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Por favor, selecciona un archivo de imagen válido.');
                return;
            }

            const cleanName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            assetNameInput.value = cleanName.replace(/[^a-zA-Z0-9_-]/g, '_');

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    thumbPreview.src = event.target.result;
                    dropZone.classList.add('hidden');
                    thumbnailContainer.classList.remove('hidden');
                    processBtn.disabled = false;
                    generateMapsPreview();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentActiveTab = e.target.getAttribute('data-map');
                renderActiveTabPreview();
            });
        });

        async function generateMapsPreview() {
            if (!loadedImage) return;
            loadingOverlay.classList.remove('hidden');
            loadingText.textContent = 'Generando mapas PBR mejorados (Normal & Roughness ajustados)...';

            const size = 2048;
            canvas.width = size;
            canvas.height = size;

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.clearRect(0, 0, size, size);
            
            const imgWidth = loadedImage.naturalWidth;
            const imgHeight = loadedImage.naturalHeight;
            
            let renderWidth, renderHeight, offsetX, offsetY;
            const canvasAspect = 1; 
            const imageAspect = imgWidth / imgHeight;

            if (imageAspect > canvasAspect) {
                renderHeight = size;
                renderWidth = imgWidth * (size / imgHeight);
                offsetX = (size - renderWidth) / 2;
                offsetY = 0;
            } else {
                renderWidth = size;
                renderHeight = imgHeight * (size / imgWidth);
                offsetX = 0;
                offsetY = (size - renderHeight) / 2;
            }

            ctx.drawImage(loadedImage, offsetX, offsetY, renderWidth, renderHeight);

            let imgData = ctx.getImageData(0, 0, size, size);
            processedMaps.basecolor = canvas.toDataURL('image/png');

            // --- ROUGHNESS (Corregido: limpio, con fondo gris claro uniforme y cantos definidos tipo muestra) ---
            const rCanvas = document.createElement('canvas');
            rCanvas.width = size; rCanvas.height = size;
            const rCtx = rCanvas.getContext('2d');
            rCtx.putImageData(imgData, 0, 0);
            let rData = rCtx.getImageData(0, 0, size, size);
            for (let i = 0; i < rData.data.length; i += 4) {
                let gray = (rData.data[i] * 0.299 + rData.data[i+1] * 0.587 + rData.data[i+2] * 0.114);
                // Invertir y remapear niveles para buscar el tono claro estructurado de la muestra de referencia
                let rough = 255 - gray;
                rough = Math.min(255, Math.max(0, (rough - 80) * 1.6 + 210)); 
                rData.data[i] = rough; rData.data[i+1] = rough; rData.data[i+2] = rough;
            }
            rCtx.putImageData(rData, 0, 0);
            processedMaps.roughness = rCanvas.toDataURL('image/png');

            // --- HEIGHT MAP ---
            const hCanvas = document.createElement('canvas');
            hCanvas.width = size; hCanvas.height = size;
            const hCtx = hCanvas.getContext('2d');
            hCtx.putImageData(imgData, 0, 0);
            let hData = hCtx.getImageData(0, 0, size, size);
            for (let i = 0; i < hData.data.length; i += 4) {
                let gray = (hData.data[i] * 0.299 + hData.data[i+1] * 0.587 + hData.data[i+2] * 0.114);
                gray = Math.min(255, Math.max(0, (gray - 128) * 1.3 + 128));
                hData.data[i] = gray; hData.data[i+1] = gray; hData.data[i+2] = gray;
            }
            hCtx.putImageData(hData, 0, 0);
            processedMaps.height = hCanvas.toDataURL('image/png');

            // --- AMBIENT OCCLUSION (AO) ---
            const aoCanvas = document.createElement('canvas');
            aoCanvas.width = size; aoCanvas.height = size;
            const aoCtx = aoCanvas.getContext('2d');
            aoCtx.putImageData(imgData, 0, 0);
            let aoData = aoCtx.getImageData(0, 0, size, size);
            for (let i = 0; i < aoData.data.length; i += 4) {
                let gray = (aoData.data[i] * 0.299 + aoData.data[i+1] * 0.587 + aoData.data[i+2] * 0.114);
                gray = Math.pow(gray / 255.0, 0.7) * 255.0; 
                gray = Math.min(255, Math.max(0, (gray - 100) * 1.8 + 140));
                aoData.data[i] = gray; aoData.data[i+1] = gray; aoData.data[i+2] = gray;
            }
            aoCtx.putImageData(aoData, 0, 0);
            processedMaps.ao = aoCanvas.toDataURL('image/png');

            // --- NORMAL MAP (Corregido: alto contraste, relieve agresivo y colores vivos estilo muestra) ---
            const nCanvas = document.createElement('canvas');
            nCanvas.width = size; nCanvas.height = size;
            const nCtx = nCanvas.getContext('2d');
            
            nCtx.filter = 'contrast(190%) brightness(105%)';
            nCtx.drawImage(loadedImage, 0, 0, size, size);
            nCtx.filter = 'none';

            const nPixels = nCtx.getImageData(0, 0, size, size).data;
            const outNormal = nCtx.createImageData(size, size);
            const outData = outNormal.data;
            const strength = 32.0; 

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    let idx = (y * size + x) * 4;
                    let xLeft = (x > 1 ? (y * size + (x - 2)) : idx) * 4;
                    let xRight = (x < size - 2 ? (y * size + (x + 2)) : idx) * 4;
                    let yUp = (y > 1 ? ((y - 2) * size + x) : idx) * 4;
                    let yDown = (y < size - 2 ? ((y + 2) * size + x) : idx) * 4;

                    let dzdx = (nPixels[xRight] - nPixels[xLeft]) / 255.0 * strength;
                    let dzdy = (nPixels[yDown] - nPixels[yUp]) / 255.0 * strength;

                    let len = Math.sqrt(dzdx * dzdx + dzdy * dzdy + 1.0);
                    outData[idx] = Math.floor((-dzdx / len * 0.5 + 0.5) * 255);
                    outData[idx+1] = Math.floor((-dzdy / len * 0.5 + 0.5) * 255);
                    outData[idx+2] = Math.floor((1.0 / len * 0.5 + 0.5) * 255);
                    outData[idx+3] = 255;
                }
            }
            nCtx.putImageData(outNormal, 0, 0);
            processedMaps.normal = nCanvas.toDataURL('image/png');

            // --- HDRI PANORAMA ---
            const hdriCanvas = document.createElement('canvas');
            hdriCanvas.width = 4096; hdriCanvas.height = 2048;
            const hdriCtx = hdriCanvas.getContext('2d');
            hdriCtx.filter = 'blur(30px)';
            hdriCtx.drawImage(loadedImage, 0, 0, 4096, 2048);
            hdriCtx.filter = 'none';
            hdriCtx.drawImage(loadedImage, 1024, 512, 2048, 1024);
            processedMaps.hdri = hdriCanvas.toDataURL('image/png');

            loadingOverlay.classList.add('hidden');
            renderActiveTabPreview();
        }

        function renderActiveTabPreview() {
            if (!processedMaps[currentActiveTab]) return;
            const img = new Image();
            img.onload = () => {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = processedMaps[currentActiveTab];
        }

        processBtn.addEventListener('click', async () => {
            const assetName = assetNameInput.value.trim() || 'MaterialPro';
            loadingOverlay.classList.remove('hidden');
            loadingText.textContent = 'Empaquetando pack ZIP...';

            const zip = new JSZip();
            const folder = zip.folder(assetName);

            if (document.getElementById('genBaseColor').checked && processedMaps.basecolor) {
                folder.file(`${assetName}_BaseColor.png`, dataURLtoBlob(processedMaps.basecolor));
            }
            if (document.getElementById('genRoughness').checked && processedMaps.roughness) {
                folder.file(`${assetName}_Roughness.png`, dataURLtoBlob(processedMaps.roughness));
            }
            if (document.getElementById('genNormal').checked && processedMaps.normal) {
                folder.file(`${assetName}_Normal.png`, dataURLtoBlob(processedMaps.normal));
            }
            if (document.getElementById('genHeight').checked && processedMaps.height) {
                folder.file(`${assetName}_Height.png`, dataURLtoBlob(processedMaps.height));
            }
            if (document.getElementById('genAO').checked && processedMaps.ao) {
                folder.file(`${assetName}_AO.png`, dataURLtoBlob(processedMaps.ao));
            }
            if (document.getElementById('genHDRI').checked && processedMaps.hdri) {
                folder.file(`${assetName}_Environment.png`, dataURLtoBlob(processedMaps.hdri));
            }

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${assetName}_PBR_Pack.zip`;
            link.click();

            loadingOverlay.classList.add('hidden');
        });

        copyBtn.addEventListener('click', () => {
            const fullCode = document.documentElement.outerHTML;
            navigator.clipboard.writeText(fullCode).then(() => {
                showToast('¡Código copiado al portapapeles!');
            }).catch(err => {
                alert('Error al copiar el código');
            });
        });

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], { type: mime });
        }
    </script>
</body>
</html>
